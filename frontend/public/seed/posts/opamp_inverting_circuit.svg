<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
    <rect width="700" height="340" rx="12" fill="#18181b"/>
    <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fafafa" text-anchor="middle">Basic Electrical / Electronics: Op-Amp Inverting Amplifier</text>
    <!-- Op Amp Triangle -->
    <polygon points="360,110 360,230 480,170" fill="#27272a" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="380" y="145" font-family="system-ui, sans-serif" font-size="18" fill="#f87171">−</text>
    <text x="380" y="205" font-family="system-ui, sans-serif" font-size="18" fill="#4ade80">+</text>
    <!-- Inverting Input with R1 -->
    <line x1="120" y1="140" x2="220" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <rect x="220" y="130" width="50" height="20" fill="#3f3f46" stroke="#e4e4e7"/>
    <text x="245" y="120" font-family="monospace" font-size="12" fill="#fcd34d" text-anchor="middle">R1</text>
    <line x1="270" y1="140" x2="360" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <!-- Feedback Rf -->
    <path d="M 310 140 L 310 70 L 410 70" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="410" y="60" width="50" height="20" fill="#3f3f46" stroke="#e4e4e7"/>
    <text x="435" y="50" font-family="monospace" font-size="12" fill="#fcd34d" text-anchor="middle">Rf</text>
    <path d="M 460 70 L 530 70 L 530 170 L 480 170" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- Output -->
    <line x1="480" y1="170" x2="600" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <text x="615" y="175" font-family="monospace" font-size="14" fill="#60a5fa">Vout</text>
    <text x="350" y="295" font-family="monospace" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">Voltage Gain: Av = − (Rf / R1)</text>
  </svg>