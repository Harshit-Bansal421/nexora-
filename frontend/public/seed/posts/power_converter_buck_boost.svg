<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
  <rect width="700" height="340" rx="12" fill="#0f172a"/>
  <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Oorja EE Forum: Buck-Boost DC-DC Power Converter Circuit</text>
  <!-- DC Source -->
  <line x1="80" y1="180" x2="160" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="160" cy="180" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="185" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Vin</text>
  <!-- Switch / MOSFET -->
  <line x1="182" y1="180" x2="260" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <rect x="260" y="165" width="45" height="30" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="282" y="185" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">SW</text>
  <line x1="305" y1="180" x2="380" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <!-- Inductor L to ground -->
  <line x1="380" y1="180" x2="380" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <rect x="368" y="215" width="24" height="40" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="380" y="240" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle">L</text>
  <line x1="380" y1="255" x2="380" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <!-- Diode D -->
  <line x1="380" y1="180" x2="450" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="450,170 450,190 470,180" fill="#f87171"/>
  <line x1="470" y1="170" x2="470" y2="190" stroke="#f87171" stroke-width="2"/>
  <line x1="470" y1="180" x2="560" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <!-- Output Capacitor and Load -->
  <rect x="540" y="195" width="40" height="55" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="560" y="228" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">Rload</text>
  <!-- Formula -->
  <text x="350" y="310" font-family="monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">Output Voltage: Vout = − Vin • (D / (1 − D))</text>
</svg>
