<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
    <rect width="700" height="340" rx="12" fill="#0f172a"/>
    <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Compiler Design: DFA for Identifier Tokens [a-zA-Z][a-zA-Z0-9]*</text>
    <!-- Start State q0 -->
    <circle cx="180" cy="160" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="166" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">q0</text>
    <path d="M 100 160 L 148 160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Final State q1 -->
    <circle cx="480" cy="160" r="32" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <circle cx="480" cy="160" r="26" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="480" y="166" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">q1</text>
    <!-- Transition -->
    <line x1="212" y1="160" x2="448" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="330" y="145" font-family="monospace" font-size="14" fill="#7dd3fc" text-anchor="middle">[a-zA-Z_]</text>
    <!-- Self Loop on q1 -->
    <path d="M 470 128 C 450 70, 510 70, 490 128" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="480" y="70" font-family="monospace" font-size="13" fill="#86efac" text-anchor="middle">[a-zA-Z0-9_]</text>
  </svg>