<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
    <rect width="700" height="340" rx="12" fill="#18181b"/>
    <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fafafa" text-anchor="middle">Virtual Memory Address Translation (Page Table to Frame)</text>
    <!-- Logical Address -->
    <g transform="translate(60, 80)">
      <rect width="180" height="50" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <rect width="90" height="50" rx="6" fill="#3b82f6"/>
      <text x="45" y="30" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">p (Page)</text>
      <text x="135" y="30" font-family="monospace" font-size="14" font-weight="700" fill="#a1a1aa" text-anchor="middle">d (Offset)</text>
      <text x="90" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">Logical Address</text>
    </g>
    <!-- Page Table -->
    <g transform="translate(290, 70)">
      <rect width="120" height="180" rx="6" fill="#27272a" stroke="#60a5fa" stroke-width="2"/>
      <text x="60" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">Page Table</text>

        <rect x="10" y="40" width="100" height="26" rx="4" fill="#3f3f46"/>
        <text x="25" y="58" font-family="monospace" font-size="11" fill="#71717a">0</text>
        <text x="75" y="58" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">F#4</text>

        <rect x="10" y="72" width="100" height="26" rx="4" fill="#3f3f46"/>
        <text x="25" y="90" font-family="monospace" font-size="11" fill="#71717a">1</text>
        <text x="75" y="90" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">F#5</text>

        <rect x="10" y="104" width="100" height="26" rx="4" fill="#3f3f46"/>
        <text x="25" y="122" font-family="monospace" font-size="11" fill="#71717a">2</text>
        <text x="75" y="122" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">F#6</text>

        <rect x="10" y="136" width="100" height="26" rx="4" fill="#3f3f46"/>
        <text x="25" y="154" font-family="monospace" font-size="11" fill="#71717a">3</text>
        <text x="75" y="154" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">F#7</text>

    </g>
    <!-- Physical Memory -->
    <g transform="translate(480, 80)">
      <rect width="180" height="50" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
      <rect width="90" height="50" rx="6" fill="#22c55e"/>
      <text x="45" y="30" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">f (Frame)</text>
      <text x="135" y="30" font-family="monospace" font-size="14" font-weight="700" fill="#a1a1aa" text-anchor="middle">d (Offset)</text>
      <text x="90" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">Physical Address</text>
    </g>
    <line x1="150" y1="105" x2="290" y2="120" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <line x1="410" y1="120" x2="480" y2="105" stroke="#22c55e" stroke-width="2"/>
  </svg>
