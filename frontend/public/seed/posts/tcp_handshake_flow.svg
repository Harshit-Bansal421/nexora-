<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
    <rect width="700" height="360" rx="12" fill="#0b132b"/>
    <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">TCP 3-Way Handshake Connection Establishment</text>
    <!-- Client Host -->
    <rect x="100" y="65" width="120" height="40" rx="8" fill="#1c2541"/>
    <text x="160" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#48cae4" text-anchor="middle">Client (Browser)</text>
    <line x1="160" y1="105" x2="160" y2="310" stroke="#3a506b" stroke-width="2" stroke-dasharray="4"/>
    <!-- Server Host -->
    <rect x="480" y="65" width="120" height="40" rx="8" fill="#1c2541"/>
    <text x="540" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#48cae4" text-anchor="middle">Server (Backend)</text>
    <line x1="540" y1="105" x2="540" y2="310" stroke="#3a506b" stroke-width="2" stroke-dasharray="4"/>
    <!-- Arrow 1: SYN -->
    <line x1="160" y1="140" x2="540" y2="180" stroke="#00b4d8" stroke-width="2.5"/>
    <text x="350" y="150" font-family="monospace" font-size="13" font-weight="700" fill="#90e0ef" text-anchor="middle">1. SYN (seq = 100)</text>
    <!-- Arrow 2: SYN-ACK -->
    <line x1="540" y1="200" x2="160" y2="240" stroke="#06d6a0" stroke-width="2.5"/>
    <text x="350" y="210" font-family="monospace" font-size="13" font-weight="700" fill="#b7efc5" text-anchor="middle">2. SYN-ACK (seq = 300, ack = 101)</text>
    <!-- Arrow 3: ACK -->
    <line x1="160" y1="260" x2="540" y2="300" stroke="#ffd166" stroke-width="2.5"/>
    <text x="350" y="270" font-family="monospace" font-size="13" font-weight="700" fill="#ffe3a8" text-anchor="middle">3. ACK (seq = 101, ack = 301)</text>
  </svg>