<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
      <rect width="700" height="380" rx="12" fill="#1e1e1e"/>
      <rect width="700" height="36" rx="12" fill="#2d2d2d"/>
      <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
      <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
      <circle cx="56" cy="18" r="6" fill="#27c93f"/>
      <text x="350" y="23" font-family="monospace" font-size="12" fill="#9ca3af" text-anchor="middle">bash - 80x24</text>
      <text x="24" y="70" font-family="monospace" font-size="14" fill="#38bdf8">$ gcc fact.c -o fact</text>
      <text x="24" y="100" font-family="monospace" font-size="14" fill="#38bdf8">$ ./fact</text>
      <text x="24" y="130" font-family="monospace" font-size="14" fill="#f87171">[1] 4821 segmentation fault (core dumped) ./fact</text>
      <text x="24" y="170" font-family="monospace" font-size="14" fill="#fbbf24">Call Stack Depth Exceeded:</text>
      <text x="24" y="200" font-family="monospace" font-size="13" fill="#e2e8f0">  fact(n = 0) -> missing base condition for n &lt;= 0</text>
      <text x="24" y="225" font-family="monospace" font-size="13" fill="#e2e8f0">  fact(n = -1) -> recursive frame #1048560</text>
      <text x="24" y="250" font-family="monospace" font-size="13" fill="#e2e8f0">  fact(n = -2) -> recursive frame #1048561</text>
      <text x="24" y="300" font-family="monospace" font-size="14" fill="#4ade80">Fix: if (n &lt;= 1) return 1;</text>
    </svg>